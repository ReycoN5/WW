<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <meta name="description" content="A modern messenger">
    <link rel="icon" href="data:,">
    <title>WW Мессенджер</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-container">
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

            <!-- background ring -->
            <circle cx="60" cy="60" r="52" fill="rgba(255,255,255,0.06)"
                    stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
          
            <!-- inner ring -->
            <circle cx="60" cy="60" r="42" fill="none"
                    stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          
            <!-- BIG WW mark -->
            <path d="M30 70 L40 45 L50 70 L60 45 L70 70"
                  fill="none"
                  stroke="white"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          
            <path d="M50 70 L60 45 L70 70 L80 45 L90 70"
                  fill="none"
                  stroke="white"
                  stroke-opacity="0.75"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          
          </svg>
        </div>
        <p class="login-subtitle">Мессенджер который работает</p>
      </div>

      <!-- Tabs: Login / Register -->
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" data-mode="login">Вход</button>
        <button id="tab-register" class="auth-tab" data-mode="register">Регистрация</button>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <!-- Login field (always visible) -->
        <div class="input-group">
          <label for="username-input">Логин</label>
          <input
            type="text"
            id="username-input"
            placeholder="(Например: IVAN1998)"
            maxlength="30"
            pattern="[a-zA-Z0-9_\-\.]+"
            required
            autofocus
            autocomplete="username"
          >
          <span class="input-hint">Только латиница, цифры, _ - .</span>
        </div>

        <!-- Password field (always visible) -->
        <div class="input-group">
          <label for="password-input">Пароль</label>
          <input
            type="password"
            id="password-input"
            placeholder="Введите пароль..."
            minlength="6"
            maxlength="128"
            required
            autocomplete="current-password"
          >
          <span class="input-hint">Мин. 6 символов</span>
        </div>

        <!-- Name field (only for registration) -->
        <div class="input-group hidden" id="name-group">
          <label for="name-input">Имя (отображается в чате)</label>
          <input
            type="text"
            id="name-input"
            placeholder="Введите имя..."
            minlength="2"
            maxlength="50"
            autocomplete="nickname"
          >
          <span class="input-hint">Это имя будет видно другим</span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary">
          <span class="btn-text">Войти</span>
          <span class="btn-loader hidden">
            <span class="spinner"></span>
          </span>
        </button>
        <p id="login-error" class="error-message hidden"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="screen">
    <div class="app-layout" id="app-layout">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="user-search" placeholder="Найти контакты..." autocomplete="off">
          </div>

          <div id="users-list" class="users-list">
            <div class="loading-state">
              <span class="spinner"></span>
              <span>Загрузка контактов...</span>
            </div>
          </div>
        </div>

        <footer class="sidebar-footer">
          <div class="sidebar-user">
            <div id="current-user-avatar" class="avatar"></div>
            <span id="current-username" class="current-username"></span>
          </div>
          <button id="settings-btn" class="icon-btn" title="Настройки" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </footer>
      </aside>

      <!-- Chat Area -->
      <main id="chat-area" class="chat-area">
        <!-- Empty State -->
        <div id="chat-empty" class="chat-empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h2>Выберите чат</h2>
          <p>Выберите пользователя на боковой панели, чтобы начать общение</p>
        </div>

        <!-- Active Chat -->
        <div id="chat-active" class="chat-active hidden">
          <header class="chat-header">
            <button id="back-btn" class="icon-btn mobile-only" aria-label="Back to users">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <div id="chat-user-avatar" class="avatar"></div>
            <div class="chat-header-info">
              <h2 id="chat-username"></h2>
              <span id="chat-status" class="chat-status">Не в сети</span>
            </div>
          </header>

          <div id="messages-container" class="messages-container">
            <div id="messages-list" class="messages-list"></div>
            <div id="typing-indicator" class="typing-indicator hidden">
              <span class="typing-dots">
                <span></span><span></span><span></span>
              </span>
              <span id="typing-text">typing...</span>
            </div>
          </div>

          <!-- ─── REPLY PANEL (над инпутом) ─────────────────────────── -->
          <div id="reply-panel" class="reply-panel hidden">
            <div class="reply-panel-content">
              <span class="reply-panel-title">Ответить</span>
              <span id="reply-panel-text" class="reply-panel-text"></span>
            </div>
            <button id="reply-panel-close" class="reply-panel-close icon-btn" aria-label="Отменить ответ">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>

          <footer class="chat-input-area">
            <button id="attach-btn" class="icon-btn" title="Прикрепить файл">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>

            <!-- Hidden file inputs for attach menu -->
            <input type="file" id="file-input-photos" hidden multiple
                   accept="image/*,video/*" capture="environment">
            <input type="file" id="file-input-docs" hidden multiple
                   accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.txt,.zip,application/*">
        
            <div class="message-input-wrapper">
                <textarea 
                    id="message-input" 
                    placeholder="Напишите сообщение..." 
                    rows="1"
                    maxlength="4000"
                ></textarea>
            </div>
        
            <button id="send-btn" class="btn-send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
        </footer>
        </div>
      </main>
    </div>
  </div>

  <!-- ─── ATTACHMENT BOTTOM SHEET ─────────────────────────────────────────── -->
  <div id="attach-sheet-overlay" class="attach-sheet-overlay hidden"></div>
  <div id="attach-sheet" class="attach-sheet hidden">
    <div class="attach-sheet-handle"></div>
    <div class="attach-sheet-title">Прикрепить</div>
    <div class="attach-sheet-options">
      <button class="attach-sheet-option" data-action="photos">
        <div class="attach-option-icon attach-icon-photos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span>Фото и видео</span>
      </button>
      <button class="attach-sheet-option" data-action="files">
        <div class="attach-option-icon attach-icon-files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <span>Файл</span>
      </button>
      <button class="attach-sheet-option" data-action="camera">
        <div class="attach-option-icon attach-icon-camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <span>Камера</span>
      </button>
    </div>
    <button class="attach-sheet-cancel" id="attach-sheet-cancel">Отмена</button>
  </div>

  <!-- ─── FORWARD MODAL ─────────────────────────────────────────────────────── -->
  <div id="forward-modal-overlay" class="forward-modal-overlay hidden"></div>
  <div id="forward-modal" class="forward-modal hidden">
    <div class="forward-modal-header">
      <h3>Переслать сообщение</h3>
      <button id="forward-modal-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="forward-modal-list" class="forward-modal-list"></div>
  </div>

  <!-- ─── ФАЙЛОВАЯ ПАНЕЛЬ (preview выбранных файлов) ──────────────────────── -->
  <div id="file-preview-panel" class="file-preview-panel hidden">
    <div class="file-preview-header">
      <span id="file-preview-count">0 файлов</span>
      <div class="file-preview-actions">
        <button id="file-preview-add-more" class="btn btn-sm" title="Добавить ещё">+</button>
        <button id="file-preview-clear" class="btn btn-sm btn-danger" title="Очистить">✕</button>
      </div>
    </div>
    <div id="file-preview-grid" class="file-preview-grid"></div>
    <button id="file-preview-send" class="btn btn-primary file-preview-send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
      Отправить
    </button>
  </div>

  <!-- Error Toast Container -->
  <div id="error-toast" class="error-toast hidden">
    <span id="error-toast-text"></span>
  </div>

  <!-- ─── ПОДКЛЮЧЕНИЕ СКРИПТОВ ─────────────────────────────────────────── -->
  
  <!-- 1. Библиотеки Firebase SDK (Должны быть самыми первыми) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <!-- 2. Файл настроек приложения (где лежит ваш firebaseConfig) -->
  <script src="js/config.js"></script>

  <!-- 3. Supabase SDK для хранения файлов -->
  <script src="js/supabase.min.js"></script>

  <!-- 4. Модули утилит и API -->
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>

  <!-- 5. Интерфейс и бизнес-логика -->
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
